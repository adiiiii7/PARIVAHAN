<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parivahan Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /* This tells Tailwind to use our Night Mode toggle switch */
      tailwind.config = { darkMode: 'class' }
    </script>
    <style>
      body { 
        margin: 0; 
        /* Native Apple System Fonts */
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        -webkit-font-smoothing: antialiased;
        background-color: #000; /* Fallback */
      }
      
      /* Clean macOS-style scrollbars */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.3); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(150,150,150,0.5); }
      
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
